name: glowberry-github-actions-docker-compose-pulumi-koyeb

on:
  push:
    branches:
      - main

jobs:
  pulumi-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Verify Pulumi Installation
        run: |
          pulumi version
          mkdir -p $HOME/.pulumi/bin  # Make sure the Pulumi directory exists
          ls -la $HOME/.pulumi/bin

      - name: Clean up previous Pulumi installs and Install Pulumi
        run: |
          rm -rf $HOME/.pulumi
          curl -fsSL https://get.pulumi.com | sh
          echo "$HOME/.pulumi/bin" >> $GITHUB_PATH

      - name: Set Pulumi Access Token
        run: |
          export PULUMI_ACCESS_TOKEN=${{ secrets.PULUMI_ACCESS_TOKEN }}
          echo "Pulumi Access Token is set."

      - name: Select Pulumi Stack and Deploy
        run: |
          pulumi login
          pulumi stack select glowberry-dev-stack
          pulumi preview
          pulumi up -y

