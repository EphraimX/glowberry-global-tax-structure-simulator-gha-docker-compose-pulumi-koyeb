name: glowberry-github-actions-docker-compose-pulumi-koyeb

on:
  push:
    branches:
      - main

jobs:
  pulumi-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
      
      - name: Pulumi Deploy
        run: |
          export KOYEB_TOKEN=${{secrets.KOYEB_TOKEN}}
          sudo apt-get update
          sudo apt-get install -y curl
          curl -fsSL https://get.pulumi.com | sh
          export PATH=$HOME/.pulumi/bin:$PATH
          export PULUMI_ACCESS_TOKEN=${{secrets.PULUMI_ACCESS_TOKEN}}
          pulumi login
          pulumi stack init glowberry-dev-stack || pulumi stack select glowberry-dev-stack
          pulumi plugin install language yaml
          pulumi preview
          pulumi up -y