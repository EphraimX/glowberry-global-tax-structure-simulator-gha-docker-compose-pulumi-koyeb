name: glowberry-github-actions-docker-compose-pulumi-koyeb

on:
  push:
    branches:
      - main

jobs:
  pulumi-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install Dependencies and Pulumi
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -fsSL https://get.pulumi.com | sh
        shell: bash

      - name: Add Pulumi to PATH
        run: echo "$HOME/.pulumi/bin" >> $GITHUB_PATH

      - name: Pulumi Preview & Deploy
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          pulumi login
          pulumi stack select glowberry-dev-stack || pulumi stack init glowberry-dev-stack
          pulumi preview
          pulumi up -y
