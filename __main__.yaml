resources:

  my-app:
    type: koyeb:App
    properties:
      name: gtaxsim-gha-dkr-plkb 
  
  my-service:
    type: koyeb:Service
    properties:
      appName: ${myApp.name}
      definition:
        name: gtaxsim-gha-dkr-plkb 
        instanceTypes:
          - type: nano
        ports:
          - port: 3000
            protocol: http
        scalings:
          - min: 1
            max: 1
        routes:
          - path: "/"
            port: 3000
        regions:
          - fra
        git:
            branch: "main"
            dockerfile:
                dockerfile: "Dockerfile.koyeb"
                privileged: true
            repository: "https://github.com/EphraimX/glowberry-global-tax-structure-simulator-gha-docker-compose-pulumi-koyeb"
            workdir: "./"
        healthChecks:
              http:
                path: "/"
                port: 3000
    options:
      dependson:
        - ${["my-app"]}
    